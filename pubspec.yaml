name: tidal_connect_lite
description: A lightweight Tidal player and DLNA controller for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  flutter_secure_storage: ^9.0.0
  dio: ^5.4.0
  flutter_volume_controller: ^2.0.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.8
  test: ^1.24.9

flutter:
  uses-material-design: true

name: tidal_connect_lite
description: A lightweight Tidal player and DLNA controller for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  flutter_secure_storage: ^9.0.0
  dio: ^5.4.0
  google_fonts: ^6.2.1
  webview_flutter: ^4.7.0
  webview_flutter_android: ^4.12.0
  crypto: ^3.0.7
  audio_service: ^0.18.19
  xml: ^6.5.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 테스트에서 타이머(예: DLNA 1초 폴링)를 실제로 기다리지 않고 진행시킨다.
  fake_async: ^1.3.0
  # 속성 기반 테스트. seed는 test/helpers/pbt_config.dart에서 고정한다.
  kiri_check: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

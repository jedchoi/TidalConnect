name: check

# 푸시와 PR마다 tool/check.sh와 같은 점검(포맷, analyze, flutter test, Kotlin 단위 테스트)을 실행한다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 개발 Mac과 같은 버전으로 고정한다. 최신 stable(3.47+)은 package:flutter/material.dart를
      # 폐기 예정으로 표시해 --fatal-infos 점검이 실패한다. 버전을 올릴 때는 로컬과 함께 올리고
      # material_ui 패키지로 옮기는 작업을 같이 한다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      # gradlew와 local.properties는 저장소에 없으므로(.gitignore) Gradle 설정 파일만 생성한다.
      - name: Android Gradle 설정 생성
        run: flutter build apk --debug --config-only

      - name: 점검
        run: tool/check.sh
